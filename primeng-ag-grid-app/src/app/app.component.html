<app-header></app-header>
<div style="padding: 20px;">

  <div class="controls-main-row">
    <div class="control-item select-button-wrapper">
      <p-selectButton [options]="dealTypeOptions" [(ngModel)]="selectedDealType" optionLabel="label" optionValue="value" (onChange)="onDealTypeChange()"></p-selectButton>
    </div>
    <div class="control-item calendar-wrapper">
      <p-calendar [(ngModel)]="dateRange" selectionMode="range" [readonlyInput]="true" [showIcon]="true" appendTo="body"></p-calendar>
    </div>
    <div class="control-item search-bar-wrapper">
      <span class="p-input-icon-left">
        <i class="pi pi-search"></i>
        <input type="text" pInputText [(ngModel)]="searchQuery" (input)="onSearchQueryChanged($event)" placeholder="Search grid..." />
      </span>
    </div>
  </div>

  <ag-grid-angular
    style="width: 100%; height: 400px;"
    class="ag-theme-alpine"
    [rowData]="rowData"
    [columnDefs]="columnDefs"
    [gridOptions]="gridOptions"
    [rowSelection]="'multiple'"
    [suppressRowClickSelection]="true"
  >
  </ag-grid-angular>

  <div class="action-buttons-container">
    <p-button label="Export" icon="pi pi-upload" styleClass="p-button-secondary"></p-button>
    <p-button label="Compute" icon="pi pi-refresh" style="margin-left: .5em"></p-button>
  </div>
</div>
